# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.2.0"
  python_check_max: "3.14"

package:
  name: pyld
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/P/PyLD/pyld-${{ version }}.tar.gz
  sha256: ba2342354bb111ef7bf2b2e6c847610b6a7b1d057dd40bf8f3fd116e0c81e000

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . --no-deps -vv --no-build-isolation --disable-pip-version-check

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
  run:
    - cachetools
    - frozendict
    - lxml
    - python >=${{ python_min }}
    - requests

tests:
  - python:
      imports:
        - c14n
        - pyld
        - pyld.documentloader
        - pyld.documentloader.requests
        - pyld.documentloader.aiohttp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - ${{ python_check_max }}.*

about:
  license: BSD-3-Clause
  summary: Python implementation of the JSON-LD API
  license_file: LICENSE
  homepage: https://pypi.org/project/pyld
  repository: https://github.com/digitalbazaar/pyld

extra:
  recipe-maintainers:
    - notestaff
    - bollwyvl
