# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.3.0"
  python_check_max: "3.14"

package:
  name: pyld
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/p/pyld/pyld-${{ version }}.tar.gz
  sha256: cf5353786582056e76cb1698db32d8fc796250703311d0e5e33dd3e86f23e031

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . --no-deps -vv --no-build-isolation --disable-pip-version-check

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
  run:
    - cachetools
    - frozendict
    - lxml
    - python >=${{ python_min }}
    - requests
    - typer >=0.27
    - requests-cache >=1.3

tests:
  - python:
      imports:
        - c14n
        - pyld
        - pyld.documentloader
        - pyld.documentloader.requests
        - pyld.documentloader.aiohttp
        - pyld.cli.commands
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - ${{ python_check_max }}.*
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - pyld --help
      - pyld --version
      - pyld --version | ${{ "grep -iE" if unix else "findstr /c" }} "${{ version | replace('.', '\\.') }}"
about:
  license: BSD-3-Clause
  summary: Python implementation of the JSON-LD API
  license_file: LICENSE
  homepage: https://pypi.org/project/pyld
  repository: https://github.com/digitalbazaar/pyld

extra:
  recipe-maintainers:
    - notestaff
    - bollwyvl
